[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Polymarket 5min 中性套利机器人（含回测与仪表盘）"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "requests",
  "websockets",
  "python-dotenv",
  "fastapi",
  "uvicorn",
  "aiohttp",
  "pycryptodome",
  "eth-account",
  "eip712",
  "py-clob-client>=0.19.0",
  "brotli",
  "discord.py>=2.3.0",
  "web3>=6.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
]

[project.scripts]
ai_refactor = "tools.ai_refactor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

